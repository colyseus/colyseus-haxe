name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, neko, hl, cpp]

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install dependencies
        run: |
          haxelib install hx3compat --quiet
          # 1.0.0-beta.3 -- haxelib's 0.11.1 doesn't compile against tink_core 2
          haxelib git tink_state https://github.com/haxetink/tink_state.git b01eb8bd47f7264420604b5f8816dde69e5dec55 --quiet
          haxelib install tink_url --quiet
          haxelib install tink_http --quiet
          haxelib install tink_json --quiet
          haxelib install colyseus-websocket --quiet
          haxelib install hashlink --quiet
          haxelib install hxcpp --quiet
          haxelib dev colyseus .

      - name: Run tests (js)
        if: matrix.target == 'js'
        run: haxe hxml/test.js.hxml

      - name: Run tests (neko)
        if: matrix.target == 'neko'
        run: haxe hxml/test.neko.hxml

      - name: Build HashLink from source (hl)
        if: matrix.target == 'hl'
        run: |
          sudo apt-get install -y libpng-dev libturbojpeg-dev libvorbis-dev libmbedtls-dev libuv1-dev
          # pinned to the tag matching haxelib's hashlink 1.15.0
          git clone --depth 1 --branch 1.15 https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink
          cd /tmp/hashlink
          # only what the HL/C tests link -- plain `make` also builds sdl.hdll,
          # which upstream now wants SDL3 for (not packaged on ubuntu-latest)
          make libhl fmt ssl uv hl
          sudo make install

      - name: Compile and run tests (hl)
        if: matrix.target == 'hl'
        run: |
          haxe hxml/test.hl.hxml
          cd tests/bin/hlc_test
          cc -O2 -o ../hl_test_native -std=c11 \
            -I /usr/local/include -I . \
            main.c \
            -L /usr/local/lib -lhl -lm -lpthread -luv \
            /usr/local/lib/fmt.hdll \
            /usr/local/lib/ssl.hdll \
            /usr/local/lib/uv.hdll \
            -Wl,-rpath,/usr/local/lib
          cd ..
          ./hl_test_native

      - name: Run tests (cpp)
        if: matrix.target == 'cpp'
        run: haxe hxml/test.cpp.hxml
